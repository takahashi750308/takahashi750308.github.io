<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quest 3S MR Multi-GLB Grab</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.4/dist/super-hands.min.js"></script>
  </head>
  <body>
    <a-scene physics="gravity: 0" webxr="optionalFeatures: passthrough;">
      
      <a-assets>
        <a-asset-item id="ayumi" src="https://takahashi750308/2025/glb/ayumi.glb"></a-asset-item>
        <!--<a-asset-item id="avocado-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb"></a-asset-item>-->
      </a-assets>

      <a-entity id="leftHand" hand-tracking-controls="hand: left" super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: el; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: el"></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right" super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: el; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: el"></a-entity>

      <a-entity 
        gltf-model="#ayumi" 
        position="-0.3 1.2 -0.5" 
        scale="0.15 0.15 0.15"
        class="clickable"
        grabbable>
      </a-entity>

<!--      
      <a-entity 
        gltf-model="#avocado-model" 
        position="0.3 1.2 -0.5" 
        scale="2 2 2"
        class="clickable"
        grabbable>
      </a-entity>
-->
    </a-scene>
  </body>
</html>
