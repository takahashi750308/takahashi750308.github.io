<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="XRMode:xr">
      <a-assets>
        <a-asset-item  id="ayumi" src="https://takahashi750308.github.io/ayumi.glb"></a-asset-item>
        <a-asset-item  id="haruki" src="https://takahashi750308.github.io/haruki.glb"></a-asset-item>
        <a-asset-item  id="jion" src="https://takahashi750308.github.io/jion.glb"></a-asset-item>
        <a-asset-item  id="kaho" src="https://takahashi750308.github.io/kaho.glb"></a-asset-item>
        <a-asset-item  id="koharu" src="https://takahashi750308.github.io/koharu.glb"></a-asset-item>
        <a-asset-item  id="miyu" src="https://takahashi750308.github.io/miyu.glb"></a-asset-item>
        <a-asset-item  id="rimu" src="https://takahashi750308.github.io/rimu.glb"></a-asset-item>
        <a-asset-item  id="taiga" src="https://takahashi750308.github.io/taiga.glb"></a-asset-item>
        <a-asset-item  id="takeru" src="https://takahashi750308.github.io/takeru.glb"></a-asset-item>
        <a-asset-item  id="tomokazu" src="https://takahashi750308.github.io/tomokazu.glb"></a-asset-item>
        <a-asset-item  id="yuito" src="https://takahashi750308.github.io/yuito.glb"></a-asset-item>
      </a-assets>  
      <a-entity id="leftHand" hand-tracking-grab-controls="hand:left"></a-entity>
      <a-entity id="rightHand" hand-tracking-grab-controls="hand:right"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#ayumi"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#haruki"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#jion"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#kaho"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#koharu"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#miyu"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#rimu"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#taiga"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#takeru"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#tomokazu"></a-entity>
      <a-entity grabbable="physics: false" position="0 1 -1" rotation="0 -90 0" scale="2 2 2" gltf-model="#yuito"></a-entity>
    </a-scene>
  </body>
</html>
